# Registro de docencia — transcrito de certificado_docencia.pdf
# (Universidad de Oviedo, Vicerrectorado de Políticas de Profesorado y
# Ordenación Académica; fecha de referencia 08-09-2026).
#
# UNIDAD DE DATOS: una *impartición* = una asignatura en un curso académico.
# Una misma impartición puede llegar a VARIAS titulaciones (el certificado la
# lista una vez por titulación, con las mismas horas); son la misma clase, no
# docencia repetida. Por eso las horas viven en la impartición y las
# titulaciones son una lista dentro de ella.
#
# COMPROBACIÓN: la suma de `hours` de cada curso cuadra con la columna
# «Horas Curso» del certificado, que se guarda en `official_total` para que
# cualquier cambio futuro se pueda validar contra el documento original.
#   2019-2020 157.0 · 2020-2021 225.0 · 2022-2023 230.6 · 2023-2024 231.6
#   2024-2025 221.0 · 2025-2026 186.0 · 2026-2027 166.0 (programada)
# (2021-2022 no aparece en el certificado: no hubo docencia asignada.)

source: "certificado_docencia.pdf"
source_date: "2026-09-08"
institution: "Universidad de Oviedo"

# Nombre corto de cada titulación, para las etiquetas del gráfico.
degrees:
  giisw:      { short: "Ing. Informática del Software",      level: grado,  full: "Grado en Ingeniería Informática del Software" }
  giitin:     { short: "Ing. Informática en TI",             level: grado,  full: "Grado en Ingeniería Informática en Tecnologías de la Información" }
  pceo:       { short: "PCEO Software + Matemáticas",        level: grado,  full: "PCEO Grado en Ingeniería Informática del Software / Grado en Matemáticas" }
  master_ii:  { short: "Máster Ing. Informática",            level: master, full: "Máster Universitario en Ingeniería Informática por la Universidad de Oviedo" }
  mecanica:   { short: "Ing. Mecánica",                      level: grado,  full: "Grado en Ingeniería Mecánica" }
  electrica:  { short: "Ing. Eléctrica",                     level: grado,  full: "Grado en Ingeniería Eléctrica" }
  quimica:    { short: "Ing. Química Industrial",            level: grado,  full: "Grado en Ingeniería Química Industrial" }
  electronica: { short: "Ing. Electrónica Industrial",        level: grado,  full: "Grado en Ingeniería Electrónica Industrial y Automática" }
  organizacion: { short: "Ing. Organización Industrial",      level: grado,  full: "Grado en Ingeniería de Organización Industrial" }
  industriales: { short: "Ing. Tecnologías Industriales",     level: grado,  full: "Grado en Ingeniería de Tecnologías Industriales" }
  telecom:    { short: "Ing. Tecnologías y Servicios de Telecom.", level: grado, full: "Grado en Ingeniería en Tecnologías y Servicios de Telecomunicación" }
  gap:        { short: "Gestión y Admón. Pública (online)",  level: grado,  full: "Grado en Gestión y Administración Pública (On line)" }

# Degrees that are only ever reached by the SAME shared delivery, and so behave
# as one audience rather than several. Collapsed into a single row by default:
# six identical rows say nothing that one row does not, and their 6-way tie at
# 173 h made any "top N" cut arbitrary. Expanding a chart splits them again.
#
# Grouping also fixes a real double count: full attribution charged the same
# 173 h to each of the six. Mapping a delivery's degrees through the group and
# de-duplicating counts it once.
degree_groups:
  rama_industrial:
    short: "Ing. Industriales"
    full: "Grados de la rama industrial: Mecánica, Eléctrica, Química Industrial, Electrónica Industrial y Automática, Organización Industrial y Tecnologías Industriales"
    level: grado
    members: [mecanica, electrica, quimica, electronica, organizacion, industriales]

