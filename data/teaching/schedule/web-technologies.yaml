code: "GIITIN01-4-012"
timezone: "Europe/Madrid"
location: "Escuela Politécnica de Ingeniería de Gijón"

# Subgrupos de laboratorio: día de la semana (0 = lunes … 4 = viernes) y franja.
# Las fechas concretas se derivan del lunes (`start`) de cada semana.
