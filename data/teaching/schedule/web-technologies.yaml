# Fuente única para DOS salidas:
#   1. La tabla de planificación de /teaching/web-technologies/ (lección «Planificación»).
#   2. Los ficheros .ics descargables (uno por subgrupo de laboratorio), generados
#      por src/integrations/teaching-ics.mjs en /calendar/<subject>-<grupo>.ics.
#
# Las fechas van ENTRECOMILLADAS a propósito (js-yaml convertiría 2026-09-14 en un
# Date UTC y perderíamos el control del formato). Formato "YYYY-MM-DD"; las horas
# "HH:MM" son hora local de la zona indicada en `timezone`.

