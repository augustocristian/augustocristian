bio: |-
  Cristian Augusto is an Assistant Professor at the Department of Computer Science of the
  University of Oviedo, Asturias, Spain. Augusto has been teaching courses in software
  engineering at various levels, and he is part of the GIIS Research group. His research
  focuses on optimizing resource utilization in End-to-End testing, with an emphasis on an
  optimal and cost-effective execution through test orchestration.

bio_es: |-
  Cristian Augusto es Profesor Ayudante Doctor en el Departamento de Informática de la
  Universidad de Oviedo, Asturias, España. Imparte docencia en ingeniería del software en
  distintos niveles y forma parte del grupo de investigación GIIS. Su investigación se centra
  en la optimización del uso de recursos en el testing End-to-End, con énfasis en una
  ejecución óptima y rentable mediante la orquestación de pruebas.

bio_it: |-
  Cristian Augusto è Professore Assistente presso il Dipartimento di Informatica
  dell'Università di Oviedo, Asturie, Spagna. Tiene corsi di ingegneria del software a vari
  livelli e fa parte del gruppo di ricerca GIIS. La sua ricerca si concentra
  sull'ottimizzazione dell'utilizzo delle risorse nel testing End-to-End, con enfasi su
  un'esecuzione ottimale ed economicamente efficiente attraverso l'orchestrazione dei test.

