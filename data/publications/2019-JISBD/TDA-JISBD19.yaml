abstract: >-
  En la actualidad gran cantidad de datos son compartidos para su uso, tratamiento o
  análisis entre empresas y terceros. Es habitual que estos datos tengan que ser protegidos
  con diferentes técnicas de preservación de la privacidad para dar cumplimiento a las leyes
  y regulaciones. Una de las técnicas más comunes es la anonimización que, aunque provee de
  privacidad a los datos, presenta como efecto colateral la perdida de información. Esta
  pérdida de información puede afectar negativamente al comportamiento de aquellos
  desarrollos altamente dependientes de dichos datos como son las aplicaciones inteligentes.
  Para abordar este problema, proponemos un enfoque guiado por pruebas para seleccionar el
  conjunto de datos anonimizado que mantenga un compromiso entre la calidad no funcional
  (privacidad) y la funcional (utilidad). Para ello se alimenta a las aplicaciones con los
  datos anonimizados para que tomen los patrones de comportamiento de estos, y seguidamente
  validar las predicciones con los datos originales, midiendo así su calidad funcional.
  Dicha calidad junto con la no funcional (privacidad), es ponderada según los criterios de
  usuario con el fin de alcanzar el punto de compromiso entre ambas características de
  calidad.
