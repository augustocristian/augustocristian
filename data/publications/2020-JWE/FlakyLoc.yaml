abstract: >-
  Web application testing is a great challenge due to the management of complex asynchronous
  communications, the concurrency between the clients-servers, and the heterogeneity of
  resources employed. It is difficult to ensure that a test case is re-running in the same
  conditions because it can be executed in undesirable ways according to several
  environmental factors that are not easy to fine-grain control such as network bottlenecks,
  memory issues or screen resolution. These environmental factors can cause flakiness, which
  occurs when the same test case sometimes obtains one test outcome and other times another
  outcome in the same application due to the execution of environmental factors. The tester
  usually stops relying on flaky test cases because their outcome varies during the
  re-executions. To fix and reduce the flakiness it is very important to locate and
  understand which environmental factors cause the flakiness. This paper is focused on the
  localization of the root cause of flakiness in web applications based on the
  characterization of the different environmental factors that are not controlled during
  testing. The root cause of flakiness is located by means of spectrum-based localization
  techniques that analyse the test execution under different combinations of the
  environmental factors that can trigger the flakiness. This technique is evaluated with an
  educational web platform called FullTeaching. As a result, our technique was able to
  locate automatically the root cause of flakiness and provide enough information to both
  understand it and fix it.
tags: [Software testing and debugging, Spectrum-based localization, Test flakiness, Web applications]
